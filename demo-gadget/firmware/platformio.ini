; Práctica 3: StickS3 + ENV III -> USB serial -> puente en el Mac -> n8n local (sin WiFi)
; Configuración base tomada de la documentación oficial del M5Stack StickS3.

[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5Unit-ENV@1.7.4
    bblanchon/ArduinoJson@^7.4.0
monitor_speed = 115200
